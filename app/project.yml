name: CutuqueApp
options:
  bundleIdPrefix: com.vxfontes
  deploymentTarget:
    iOS: "17.0"
# Assinatura: DEVELOPMENT_TEAM vem de Local.xcconfig (gitignored, cada dev usa o seu;
# template em Local.xcconfig.example) — não fica no repo público nem é apagado no xcodegen.
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
# Primeira (e única) dependência externa do app. SwiftTerm é um emulador VT100/
# xterm de verdade — o AnsiRenderer daqui só entende SGR e descarta movimento de
# cursor, o que basta para o espelho do tmux (que já chega como tela pronta) mas
# não para o fluxo de bytes cru do terminal livre, onde posicionar o cursor É o
# conteúdo. MIT, compatível com a AGPL-3.0 do projeto.
# O piso é 1.18.0 e NÃO pode baixar: `TerminalView.selection` (e o tipo
# `SelectionService`) só viraram `public` nessa tag — commit b4b78a3 do SwiftTerm,
# "Make SelectionService and TerminalView.selection public". Em 1.15.0 os dois são
# internal e `PTYTerminalView.selecionado()` não compila.
# 13/08/2026: estava `from: 1.15.0` desde a leva do copiar. Passava porque cada
# árvore resolvia 1.18.0 por conta própria (o `Package.resolved` mora DENTRO do
# .xcodeproj, que não é versionado — este piso é a única trava que existe). O
# checkout da Vanessa tinha 1.15.0 pinado de antes e o archive quebrou.
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.18.0
targets:
  CutuqueApp:
    type: application
    platform: iOS
    sources: [CutuqueApp, Shared, SharedWatch]
    # Entitlements de push (Fase 4). aps-environment=production para TestFlight/App
    # Store (tokens de produção; o hub aponta CUTUQUE_APNS_HOST=api.push.apple.com).
    # No simulador, com CODE_SIGNING_ALLOWED=NO, o arquivo não é embutido, mas o
    # build segue funcionando e o push simulado (xcrun simctl push) dispensa APNs real.
    entitlements:
      path: CutuqueApp/CutuqueApp.entitlements
      properties:
        aps-environment: production
        # Sem esta entitlement a Apple rebaixa o interruption-level time-sensitive
        # do needs_you e o cutucão não fura Focus/DND (review F4, bloqueante #2).
        # É self-service — não exige aprovação da Apple.
        com.apple.developer.usernotifications.time-sensitive: true
    info:
      path: CutuqueApp/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Cutuque
        CFBundleShortVersionString: "2.6.0"
        CFBundleVersion: "19"
        # Live Activities (Dynamic Island / tela de bloqueio) para sessões rodando.
        NSSupportsLiveActivities: true
        # Declara criptografia isenta (ex.: TLS/HTTPS e APIs do sistema) para
        # evitar a pergunta manual de conformidade de exportação no App Store Connect.
        ITSAppUsesNonExemptEncryption: false
        # Scheme para o deep-link da Live Activity (cutuque://session/<id>).
        CFBundleURLTypes:
          - CFBundleURLSchemes: [cutuque]
        # Sem esta chave o iOS bloqueia SILENCIOSAMENTE o app de falar com IPs
        # privados/Tailscale (o app não emite request nenhum). Com ela, o iOS
        # mostra o prompt de Rede Local e passa a permitir após o usuário aceitar.
        NSLocalNetworkUsageDescription: "O Cutuque fala com o seu hub na rede privada (Tailscale) para listar sessões e receber avisos."
        # Dev: HTTP liberado. IMPORTANTE — só NSAllowsArbitraryLoads: se ele
        # coexistir com NSAllowsLocalNetworking, o iOS IGNORA o ArbitraryLoads
        # (trata como false) e o LocalNetworking NÃO cobre a faixa CGNAT
        # 100.64/10 do Tailscale → HTTP pro hub dá erro -1022. Apertar (HTTPS/
        # exceção por domínio) antes da App Store (Fase 5+).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # iPad suporta as quatro orientações — girar é caso de primeira classe no
        # design (a split view existe justamente pra rotação não remontar a árvore).
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vxfontes.cutuque
        SWIFT_VERSION: "5.9"
        # "1,2" = iPhone + iPad. O widget acompanha o app: uma Live Activity de
        # extension declarada só como iPhone não aparece no iPad.
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: CutuqueWidgets
      - target: CutuqueWatch
        embed: true
      # Só o app do iPhone/iPad: o widget não desenha terminal e o relógio nem
      # alcança o hub.
      - package: SwiftTerm
        product: SwiftTerm
    # Liga o bundle de testes ao scheme do app, para `xcodebuild test` achar.
    scheme:
      testTargets:
        - CutuqueAppTests

  # App do Apple Watch (watchOS 9+ single-target). Cliente fino que fala com o
  # iPhone via WatchConnectivity (o hub só existe na Tailscale, fora do alcance
  # do relógio).
  CutuqueWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources: [CutuqueWatch, SharedWatch]
    resources: [CutuqueWatch/Assets.xcassets]
    info:
      path: CutuqueWatch/Info.plist
      properties:
        CFBundleDisplayName: Cutuque
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "2.6.0"
        CFBundleVersion: "19"
        ITSAppUsesNonExemptEncryption: false
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.vxfontes.cutuque
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vxfontes.cutuque.watchkitapp
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Widget extension: hospeda a Live Activity (ActivityKit vive numa extension).
  CutuqueWidgets:
    type: app-extension
    platform: iOS
    sources: [CutuqueWidgets, Shared]
    info:
      path: CutuqueWidgets/Info.plist
      properties:
        CFBundleDisplayName: Cutuque
        CFBundleShortVersionString: "2.6.0"
        CFBundleVersion: "19"
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vxfontes.cutuque.widgets
        SWIFT_VERSION: "5.9"
        # "1,2" = iPhone + iPad. O widget acompanha o app: uma Live Activity de
        # extension declarada só como iPhone não aparece no iPad.
        TARGETED_DEVICE_FAMILY: "1,2"

  # Testes unitários da lógica pura do app (geometria do terminal, debounce,
  # movimento do board, mapa de teclas). Não há UI test — é decisão do spec.
  CutuqueAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CutuqueAppTests]
    dependencies:
      - target: CutuqueApp
    settings:
      base:
        # xcodegen não gera Info.plist automaticamente pra bundle.unit-test;
        # sem isto o code sign falha ("does not have an Info.plist file").
        GENERATE_INFOPLIST_FILE: YES
